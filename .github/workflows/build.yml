name: Build Astra Client

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Build mod from clean state
        run: gradle clean build --no-daemon

      - name: Verify production JAR and source registry
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort | head -n 1)"
          test -n "$JAR"
          test -s "$JAR"
          jar tf "$JAR" > /tmp/jar-contents.txt
          grep -q '^fabric.mod.json$' /tmp/jar-contents.txt
          grep -q '^astraclient.mixins.json$' /tmp/jar-contents.txt
          unzip -p "$JAR" fabric.mod.json | python -m json.tool >/dev/null
          unzip -p "$JAR" astraclient.mixins.json | python -m json.tool >/dev/null

          python - <<'PY'
          import json
          import pathlib
          import re
          import subprocess
          import sys
          import zipfile

          root = pathlib.Path("src/main/java/com/astraclient")
          client = (root / "AstraClient.java").read_text(encoding="utf-8")
          screen = (root / "AstraScreen.java").read_text(encoding="utf-8")
          options = (root / "AstraModuleOptions.java").read_text(encoding="utf-8")
          mixin_config = json.loads(pathlib.Path("src/main/resources/astraclient.mixins.json").read_text(encoding="utf-8"))

          static = re.search(r"static\s*\{(.*?)\n    \}", client, re.S)
          if not static:
              sys.exit("ERROR: Astra module registry initializer not found")
          registered = re.findall(r'MODULES\.put\("([^"]+)"', static.group(1))
          gui = re.findall(
              r'new ModuleInfo\("([^"]+)",\s*"[^"]+",\s*"[^"]+",\s*"([^"]+)",\s*(true|false)\)',
              screen,
          )
          gui_ids = [module_id for module_id, _, _ in gui]
          for label, values in (("registry", registered), ("GUI", gui_ids)):
              duplicates = sorted({value for value in values if values.count(value) > 1})
              if duplicates:
                  sys.exit(f"ERROR: duplicate {label} module IDs: {duplicates}")
          if set(registered) != set(gui_ids):
              sys.exit(f"ERROR: module/GUI mismatch; missing cards={sorted(set(registered)-set(gui_ids))}; unregistered cards={sorted(set(gui_ids)-set(registered))}")

          imported_modules = (
              "autoarmor", "autofish", "cheststealer", "novelocity", "noweb",
              "nopush", "fireworkesp", "autojump", "noclip", "nojumpdelay", "nameprotect",
          )
          for module_id in imported_modules:
              if f'MODULES.put("{module_id}"' not in client:
                  sys.exit(f"ERROR: imported module {module_id} not registered")
              if f'new ModuleInfo("{module_id}"' not in screen:
                  sys.exit(f"ERROR: imported module {module_id} missing from GUI")

          for setting in ('"fov"', '"rotation_mode"', '"alias"', '"delay_ms"', '"reel_delay_ms"'):
              if setting not in options:
                  sys.exit(f"ERROR: expected setting {setting} is missing")

          listed = mixin_config.get("client", [])
          if len(listed) != len(set(listed)):
              sys.exit("ERROR: duplicate mixin name in astraclient.mixins.json")
          jar_path = pathlib.Path(subprocess.check_output(
              "find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort | head -n 1",
              shell=True, text=True
          ).strip())
          with zipfile.ZipFile(jar_path) as archive:
              packaged = set(archive.namelist())
          for name in listed:
              source = root / "mixin" / f"{name}.java"
              class_path = f"com/astraclient/mixin/{name}.class"
              if not source.is_file():
                  sys.exit(f"ERROR: configured mixin source missing: {source}")
              if class_path not in packaged:
                  sys.exit(f"ERROR: configured mixin missing from JAR: {class_path}")
          for module_id in imported_modules:
              print(f"Verified imported module registration and GUI card: {module_id}")
          print(f"Module registry consistent: {len(registered)} modules, {len(gui_ids)} cards.")
          print(f"Mixin config consistent: {len(listed)} mixins are present in source and JAR.")
          print(f"Verified production artifact: {jar_path} ({jar_path.stat().st_size} bytes).")
          PY

      - name: Upload verified production JAR
        uses: actions/upload-artifact@v7
        with:
          name: AstraClient-1.21.4-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
