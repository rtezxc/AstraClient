name: Build Astra Client
# CI refresh: validate the latest main branch after the Astra 1.1.0 update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Build mod from clean state
        run: gradle clean build --no-daemon

      - name: Verify mod JAR contents
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort | head -n 1)"
          if [[ -z "$JAR" ]]; then
            echo "ERROR: production JAR not found"
            find build/libs -maxdepth 1 -type f -print || true
            exit 1
          fi
          echo "Built artifact: $JAR"
          test -s "$JAR"
          ls -lh "$JAR"
          jar tf "$JAR" | tee /tmp/jar-contents.txt
          grep -q '^fabric.mod.json

      - name: Upload verified production JAR only
        uses: actions/upload-artifact@v4
        with:
          name: AstraClient-1.21.4-JAR
          path: ${{ steps.verify.outputs.jar_file }}
          if-no-files-found: error
          retention-days: 14
 /tmp/jar-contents.txt
          grep -q '^astraclient.mixins.json

      - name: Upload verified production JAR only
        uses: actions/upload-artifact@v4
        with:
          name: AstraClient-1.21.4-JAR
          path: ${{ steps.verify.outputs.jar_file }}
          if-no-files-found: error
          retention-days: 14
 /tmp/jar-contents.txt
          grep -q '^com/astraclient/AstraClient.class

      - name: Upload verified production JAR only
        uses: actions/upload-artifact@v4
        with:
          name: AstraClient-1.21.4-JAR
          path: ${{ steps.verify.outputs.jar_file }}
          if-no-files-found: error
          retention-days: 14
 /tmp/jar-contents.txt
          grep -q '^com/astraclient/AstraScreen.class

      - name: Upload verified production JAR only
        uses: actions/upload-artifact@v4
        with:
          name: AstraClient-1.21.4-JAR
          path: ${{ steps.verify.outputs.jar_file }}
          if-no-files-found: error
          retention-days: 14
 /tmp/jar-contents.txt
          grep -q '^com/astraclient/AstraModuleSettingsScreen.class

      - name: Upload verified production JAR only
        uses: actions/upload-artifact@v4
        with:
          name: AstraClient-1.21.4-JAR
          path: ${{ steps.verify.outputs.jar_file }}
          if-no-files-found: error
          retention-days: 14
 /tmp/jar-contents.txt
          grep -q '^com/astraclient/AstraHudEditorScreen.class

      - name: Upload verified production JAR only
        uses: actions/upload-artifact@v4
        with:
          name: AstraClient-1.21.4-JAR
          path: ${{ steps.verify.outputs.jar_file }}
          if-no-files-found: error
          retention-days: 14
 /tmp/jar-contents.txt
          grep -q '^com/astraclient/AstraBackgroundRenderer.class

      - name: Upload verified production JAR only
        uses: actions/upload-artifact@v4
        with:
          name: AstraClient-1.21.4-JAR
          path: ${{ steps.verify.outputs.jar_file }}
          if-no-files-found: error
          retention-days: 14
 /tmp/jar-contents.txt
          grep -q '^com/astraclient/mixin/AstraPanoramaMixin.class

      - name: Upload verified production JAR only
        uses: actions/upload-artifact@v4
        with:
          name: AstraClient-1.21.4-JAR
          path: ${{ steps.verify.outputs.jar_file }}
          if-no-files-found: error
          retention-days: 14
 /tmp/jar-contents.txt
          grep -q '^com/astraclient/mixin/AstraWorldMenuBackgroundMixin.class

      - name: Upload verified production JAR only
        uses: actions/upload-artifact@v4
        with:
          name: AstraClient-1.21.4-JAR
          path: ${{ steps.verify.outputs.jar_file }}
          if-no-files-found: error
          retention-days: 14
 /tmp/jar-contents.txt
          unzip -p "$JAR" fabric.mod.json | python -m json.tool >/dev/null
          unzip -p "$JAR" astraclient.mixins.json | python -m json.tool >/dev/null
          echo "jar_file=$JAR" >> "$GITHUB_OUTPUT"

      - name: Upload verified production JAR only
        uses: actions/upload-artifact@v4
        with:
          name: AstraClient-1.21.4-JAR
          path: ${{ steps.verify.outputs.jar_file }}
          if-no-files-found: error
          retention-days: 14
