name: Build Astra Client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build mod from clean state
        run: gradle clean build --no-daemon

      - name: Verify mod JAR contents
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          test -n "$JAR"
          echo "Built artifact: $JAR"
          ls -lh "$JAR"
          jar tf "$JAR" | tee /tmp/jar-contents.txt
          grep -q '^fabric.mod.json$' /tmp/jar-contents.txt
          grep -q '^com/astraclient/AstraClient.class$' /tmp/jar-contents.txt
          grep -q '^com/astraclient/AstraScreen.class$' /tmp/jar-contents.txt

      - name: Upload verified mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: AstraClient-1.21.4-JAR
          path: build/libs/*.jar
          if-no-files-found: error
