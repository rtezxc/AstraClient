name: Build Astra Client
# Build and inspect the distributable mod JAR on every main-branch update.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Build mod from clean state
        run: gradle clean build --no-daemon

      - name: Verify production JAR contents and metadata
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort | head -n 1)"
          if [[ -z "$JAR" ]]; then
            echo "ERROR: production JAR not found"
            find build/libs -maxdepth 1 -type f -print || true
            exit 1
          fi
          test -s "$JAR"
          echo "Built artifact: $JAR"
          ls -lh "$JAR"
          jar tf "$JAR" | tee /tmp/jar-contents.txt
          grep -q '^fabric.mod.json$' /tmp/jar-contents.txt
          grep -q '^astraclient.mixins.json$' /tmp/jar-contents.txt
          grep -q '^com/astraclient/AstraClient.class$' /tmp/jar-contents.txt
          grep -q '^com/astraclient/AstraScreen.class$' /tmp/jar-contents.txt
          grep -q '^com/astraclient/AstraModuleSettingsScreen.class$' /tmp/jar-contents.txt
          grep -q '^com/astraclient/AstraHudEditorScreen.class$' /tmp/jar-contents.txt
          grep -q '^com/astraclient/AstraBackgroundRenderer.class$' /tmp/jar-contents.txt
          grep -q '^com/astraclient/mixin/AstraPanoramaMixin.class$' /tmp/jar-contents.txt
          grep -q '^com/astraclient/mixin/AstraWorldMenuBackgroundMixin.class$' /tmp/jar-contents.txt
          grep -q '^com/astraclient/mixin/AstraFastPlaceMixin.class$' /tmp/jar-contents.txt
          grep -q '^com/astraclient/mixin/AstraFastBreakMixin.class$' /tmp/jar-contents.txt
          grep -q '^com/astraclient/mixin/AstraNoWeatherMixin.class$' /tmp/jar-contents.txt
          unzip -p "$JAR" fabric.mod.json | python -m json.tool >/dev/null
          unzip -p "$JAR" astraclient.mixins.json | python -m json.tool >/dev/null
          unzip -p "$JAR" astraclient.mixins.json | grep -q '"AstraFastPlaceMixin"'
          unzip -p "$JAR" astraclient.mixins.json | grep -q '"AstraFastBreakMixin"'
          unzip -p "$JAR" astraclient.mixins.json | grep -q '"AstraNoWeatherMixin"'

          python - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path("src/main/java/com/astraclient")
          client = (root / "AstraClient.java").read_text(encoding="utf-8")
          screen = (root / "AstraScreen.java").read_text(encoding="utf-8")

          # Restrict registry parsing to the static initializer, where modules are registered.
          static = re.search(r"static\s*\{(.*?)\n    \}", client, re.S)
          if not static:
              sys.exit("ERROR: AstraClient module registry initializer not found")
          registered = re.findall(r'MODULES\.put\("([^"]+)"', static.group(1))
          gui = re.findall(
              r'new ModuleInfo\("([^"]+)",\s*"[^"]+",\s*"[^"]+",\s*"([^"]+)",\s*(true|false)\)',
              screen,
          )

          if len(registered) != len(set(registered)):
              duplicates = sorted({item for item in registered if registered.count(item) > 1})
              sys.exit(f"ERROR: duplicate module registry IDs: {duplicates}")
          gui_ids = [item[0] for item in gui]
          if len(gui_ids) != len(set(gui_ids)):
              duplicates = sorted({item for item in gui_ids if gui_ids.count(item) > 1})
              sys.exit(f"ERROR: duplicate GUI module IDs: {duplicates}")

          registered_set = set(registered)
          gui_set = set(gui_ids)
          implemented = {module_id for module_id, _, is_implemented in gui if is_implemented == "true"}
          missing_registration = sorted(implemented - registered_set)
          missing_gui = sorted(registered_set - gui_set)
          if missing_registration:
              sys.exit(f"ERROR: GUI marks modules implemented but they are not registered: {missing_registration}")
          if missing_gui:
              sys.exit(f"ERROR: registered modules missing from the GUI: {missing_gui}")

          print(f"Module consistency passed: {len(registered_set)} registered modules, {len(gui_ids)} GUI entries.")
          print("Every implemented GUI module is registered; module IDs are unique and discoverable.")
          PY

          echo "jar_file=$JAR" >> "$GITHUB_OUTPUT"

      - name: Upload verified production JAR only
        uses: actions/upload-artifact@v7
        with:
          name: AstraClient-1.21.4-JAR
          path: ${{ steps.verify.outputs.jar_file }}
          if-no-files-found: error
          retention-days: 14
