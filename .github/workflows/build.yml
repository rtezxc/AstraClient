          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path("src/main")
          mixin_config_path = root / "resources" / "astraclient.mixins.json"
          mod_json_path = root / "resources" / "fabric.mod.json"
          mixin_config = json.loads(mixin_config_path.read_text(encoding="utf-8"))
          mod_json = json.loads(mod_json_path.read_text(encoding="utf-8"))
          mixin_package = mixin_config.get("package", "")
          mixin_names = mixin_config.get("client", [])
          if not mixin_names:
              sys.exit("ERROR: no client mixins are configured")
          if len(mixin_names) != len(set(mixin_names)):
              sys.exit("ERROR: duplicate client mixin entries in astraclient.mixins.json")
          if "astraclient.mixins.json" not in mod_json.get("mixins", []):
              sys.exit("ERROR: fabric.mod.json does not load astraclient.mixins.json")

          jar_entries = set(subprocess.check_output(["jar", "tf", __import__("os").environ["JAR"]], text=True).splitlines())
          for name in mixin_names:
              source = root / "java" / pathlib.Path(*mixin_package.split(".")) / f"{name}.java"
              class_entry = f"{mixin_package.replace('.', '/')}/{name}.class"
              if not source.is_file():
                  sys.exit(f"ERROR: configured mixin has no source file: {source}")
              if class_entry not in jar_entries:
                  sys.exit(f"ERROR: configured mixin is missing from the production JAR: {class_entry}")
              source_text = source.read_text(encoding="utf-8")
              if "@Mixin(" not in source_text or "@Inject(" not in source_text:
                  sys.exit(f"ERROR: configured mixin lacks an expected Mixin/Inject annotation: {name}")
          print(f"Mixin packaging passed: {len(mixin_names)} configured client mixins are present in source and production JAR.")
          PY

